<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>LTALK 채팅방 목록</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/chatroomtest.css" />
    <script src="/js/chatroomtest.js" defer></script>
</head>
<body>
<header class="container">
    <h1>LTALK 채팅방</h1>
    <div class="row gap">
        <button id="connect">웹소켓 연결</button>
        <button id="refresh" class="secondary">목록 새로고침</button>
        <input id="q" type="search" placeholder="방/멤버/최근 메시지 검색..." />
    </div>
</header>

<main class="container">
    <div id="status" class="muted" hidden>불러오는 중...</div>
    <div id="list" class="list" hidden></div>
</main>

<!-- 모달 -->
<div id="backdrop" class="backdrop" aria-hidden="true">
    <div class="modal" role="dialog" aria-modal="true">
        <div class="modal-head">
            <div>
                <h2 id="modal-title">채팅방</h2>
                <div id="modal-sub" class="muted small"></div>
            </div>
            <div class="right">
                <span id="modal-substate" class="badge">구독: OFF</span>
                <button id="closeModal" class="icon" aria-label="닫기">×</button>
            </div>
        </div>

        <div id="modalStatus" class="muted small"></div>

        <div id="chatLog" class="chat-log" aria-live="polite"></div>

        <div class="chat-input">
            <textarea id="chatInput" rows="2" placeholder="메시지를 입력하고 Enter로 전송"></textarea>
            <button id="sendBtn">보내기</button>
        </div>
    </div>
</div>

<!-- SockJS & STOMP CDN -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<!-- 앱 스크립트 -->
</body>
</html>
