<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>LTALK 채팅방 목록</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <link rel="stylesheet" href="/css/main.css" />

    <!-- SockJS & STOMP (CDN) -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

    <script src="/js/main.js" defer></script>
</head>
<body>
<div class="wrap">
    <div class="hdr">
        <div class="logo">LT</div>
        <div class="title">채팅방</div>
        <div class="sub">
            참여 중인 방과 마지막 메시지를 한눈에
            <span id="wsState" style="margin-left:8px;font-weight:700;"></span>
        </div>
    </div>

    <div class="toolbar">
        <div class="search">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M21 21l-3.5-3.5M10.5 18a7.5 7.5 0 1 1 0-15 7.5 7.5 0 0 1 0 15Z" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/></svg>
            <input id="q" type="search" placeholder="방 이름, 참여자, 메시지 검색…" />
        </div>
        <button class="refresh" id="btnRefresh">새로고침</button>
    </div>

    <div class="card">
        <div id="state" class="loading">
            <div class="skeleton"></div>
            <div class="skeleton"></div>
            <div class="skeleton"></div>
        </div>
        <div id="list" class="list" hidden></div>
    </div>
</div>
<div id="chatModal" class="modal" hidden>
    <div class="modal__backdrop" data-close="1"></div>
    <div class="modal__panel">
        <div class="modal__hdr">
            <div class="modal__title">
                <span id="chatModalRoomName">채팅</span>
            </div>
            <button id="chatModalClose" class="modal__close" aria-label="닫기">×</button>
        </div>

        <div id="chatScroll" class="modal__body">
            <!-- 위로 스크롤 시 과거 로딩 -->
            <div id="chatLoadingTop" class="modal__loading" hidden>이전 메시지 불러오는 중…</div>
            <div id="chatList" class="chatlist"></div>
        </div>

        <!-- 보내기 UI가 필요하면 아래 주석 해제 -->
        <!--
        <div class="modal__ftr">
          <input id="chatInput" class="modal__input" type="text" placeholder="메시지를 입력하세요" />
          <button id="chatSend" class="modal__send">보내기</button>
        </div>
        -->
    </div>
</div>
</body>
</html>
