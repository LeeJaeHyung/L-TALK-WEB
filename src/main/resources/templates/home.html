<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>채팅 데모</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        #log { border:1px solid #ccc; padding:8px; max-height:260px; overflow:auto; font-family:ui-monospace,monospace; }
        button, input { padding:8px 12px; }
        .row { display:flex; gap:8px; margin-top:8px; }
        .row input { flex:1; }
    </style>
</head>
<body>
<h1>채팅방 데모 (가변 roomId)</h1>

<div class="row">
    <input id="roomId" placeholder="방 번호 입력" value="1" />
    <button id="ws_btn">웹소켓 연결</button>
    <button id="join_btn" disabled>방 참여/재참여</button>
</div>

<div class="row">
    <input id="msg" placeholder="보낼 메시지 입력" value="안녕하세요! 연결 즉시 전송 테스트" />
    <button id="send_btn" disabled>메시지 전송</button>
</div>

<pre id="log"></pre>

<!-- 로드 순서: SockJS → STOMP -->
<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0/bundles/stomp.umd.min.js"></script>

<script>
    const $btnConnect = document.getElementById('ws_btn');
    const $btnJoin    = document.getElementById('join_btn');
    const $btnSend    = document.getElementById('send_btn');
    const $msg        = document.getElementById('msg');
    const $roomId     = document.getElementById('roomId');

    const log = (m) => {
        const el = document.getElementById('log');
        el.textContent += `${new Date().toLocaleTimeString()}  ${m}\n`;
        el.scrollTop = el.scrollHeight;
    };

    // “[이거 구독이야] 받은시간 받아온주소 메세지내용”
    const logSub = (dest, body) => {
        const t = new Date().toLocaleTimeString();
        let text = body;
        try {
            const obj = JSON.parse(body);
            // ChatDto: { id, senderId, chatRoomId, message, createdAt }
            text = obj?.message ?? body;
        } catch (_) {}
        const el = document.getElementById('log');
        el.textContent += `[이거 구독이야] ${t} ${dest} ${text}\n`;
        el.scrollTop = el.scrollHeight;
    };

    // 현재 방 관련 상태
    let client = null;
    let connecting = false;
    let currentRoomId = null;
    let currentSubscription = null;

    // 목적지 생성기
    const destsOf = (rid) => ({
        topic: `/topic/chatrooms/${rid}/chats`,
        app:   `/app/chatrooms/${rid}/chats`,
    });

    // 방 구독(이전 구독 해제 → 새 방 구독)
    const subscribeRoom = (rid) => {
        const { topic } = destsOf(rid);

        // 기존 구독 있으면 해제
        if (currentSubscription) {
            try { currentSubscription.unsubscribe(); } catch (e) { /* ignore */ }
            currentSubscription = null;
            log(`UNSUBSCRIBE ← 이전 방(${currentRoomId})`);
        }

        currentSubscription = client.subscribe(topic, (frame) => {
            const dest = frame?.headers?.destination || topic;
            logSub(dest, frame.body);
        });
        log(`SUBSCRIBE → ${topic}`);
        currentRoomId = rid;
    };

    // 방으로 메시지 전송
    const sendToRoom = (rid, text) => {
        const { app } = destsOf(rid);
        client.publish({
            destination: app,
            body: JSON.stringify({ message: text })
        });
        log(`PUBLISH → ${app} : ${text}`);
    };

    // 연결 직후: 방 참여 버튼만 활성화 (방 선택은 사용자가)
    const afterConnect = () => {
        log('STOMP connected');
        $btnJoin.disabled = false;
        $btnSend.disabled = false;
    };

    // SockJS 팩토리
    const sockFactory = () => new SockJS('/ws', null, {
        transports: ['xhr-streaming', 'xhr-polling', 'websocket'],
        transportOptions: {
            'xhr-streaming': { withCredentials: true },
            'xhr-polling':   { withCredentials: true }
        }
    });

    // STOMP Client 생성
    const createClient = () => new StompJs.Client({
        webSocketFactory: sockFactory,
        reconnectDelay: 3000,
        heartbeatIncoming: 10000,
        heartbeatOutgoing: 10000,
        debug: () => {},
        onConnect: afterConnect,
        onStompError: (frame) => {
            log(`STOMP error: ${frame.headers?.message || ''}`);
            if (frame.body) log(`details: ${frame.body}`);
        },
        onWebSocketClose: (evt) => {
            log(`WS closed (code=${evt.code})`);
            $btnConnect.disabled = false;
            $btnConnect.textContent = '웹소켓 연결';
            $btnJoin.disabled = true;
            $btnSend.disabled = true;
            currentRoomId = null;
            currentSubscription = null;
            connecting = false;
        },
        onWebSocketError: () => {
            log('WS error');
            $btnConnect.disabled = false;
            $btnConnect.textContent = '웹소켓 연결';
            $btnJoin.disabled = true;
            $btnSend.disabled = true;
            currentRoomId = null;
            currentSubscription = null;
            connecting = false;
        }
    });

    // [웹소켓 연결]
    $btnConnect.addEventListener('click', () => {
        if (client?.active) {
            log('이미 연결되어 있습니다.');
            return;
        }
        if (connecting) {
            log('연결 시도 중…');
            return;
        }
        client = createClient();
        connecting = true;
        $btnConnect.disabled = true;
        $btnConnect.textContent = '연결 중…';
        client.onConnect = () => {
            afterConnect();
            $btnConnect.disabled = false;
            $btnConnect.textContent = '재연결';
            connecting = false;
        };
        client.activate();
    });

    // [방 참여/재참여] (roomId 입력값으로 구독 전환 + 즉시 한 번 전송)
    $btnJoin.addEventListener('click', () => {
        if (!client?.active) {
            log('연결되어 있지 않습니다.');
            return;
        }
        const rid = ($roomId.value || '').trim();
        if (!rid) {
            log('roomId를 입력하세요.');
            return;
        }
        subscribeRoom(rid);

        // 참여하자마자 한 번 전송(옵션)
        const firstBody = $msg.value || '안녕하세요! 연결 즉시 전송';
        sendToRoom(rid, firstBody);
    });

    // [메시지 전송] (현재 구독 중인 방으로 전송)
    $btnSend.addEventListener('click', () => {
        if (!client?.active) {
            log('연결되어 있지 않습니다.');
            return;
        }
        if (!currentRoomId) {
            log('아직 어떤 방에도 참여하지 않았습니다. 먼저 "방 참여/재참여"를 눌러 구독하세요.');
            return;
        }
        const body = $msg.value || '';
        sendToRoom(currentRoomId, body);
    });

    // 입력창에서 Enter 로도 전송하고 싶으면 아래 주석 해제
    // $msg.addEventListener('keydown', (e) => {
    //   if (e.key === 'Enter') $btnSend.click();
    // });
</script>
</body>
</html>
